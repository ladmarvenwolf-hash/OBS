
name: Подготовка сборки OBS Android

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать проект
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="OBS_Android_APK_build_ready_RU.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Ошибка: архив $ARCHIVE не найден в репозитории."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          PROJECT="extracted/OBS_for_Android-main"

          if [ ! -d "$PROJECT" ]; then
            echo "Ошибка: папка проекта не найдена."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "=== Содержимое scripts ==="
          ls -la "$PROJECT/scripts" || true

          echo "=== Скрипт сборки APK ==="
          if [ -f "$PROJECT/scripts/build-frontend-apk-wsl.sh" ]; then
            cat "$PROJECT/scripts/build-frontend-apk-wsl.sh"
          else
            echo "Скрипт сборки не найден."
          fi

          echo "=== Проверка окружения ==="
          if [ -f "$PROJECT/scripts/check-android-build-env.sh" ]; then
            cat "$PROJECT/scripts/check-android-build-env.sh"
          fi

          echo "=== Инструкция по сборке ==="
          if [ -f "$PROJECT/README.md" ]; then
            sed -n '1,220p' "$PROJECT/README.md"
          fi

      - name: Сохранить инструкции
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-build-details
          path: extracted/OBS_for_Android-main/
          if-no-files-found: warn
