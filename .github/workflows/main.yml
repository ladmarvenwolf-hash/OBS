name: Проверка сборки OBS Android

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Показать структуру репозитория
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name build.sh -o -name build-frontend-apk-wsl.sh
