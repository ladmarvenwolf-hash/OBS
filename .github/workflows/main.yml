name: Сборка OBS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5

      - name: Установить Java и инструменты
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить проект
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip zip cmake ninja-build

          mkdir -p extracted
          unzip -q OBS_Android_APK_build_ready_RU.zip -d extracted

          echo "Содержимое проекта:"
          find extracted -maxdepth 4 \
            \( -name gradlew -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name build-frontend-apk-wsl.sh \) -print

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="extracted/OBS_for_Android-main"

          if [ -f "$PROJECT/gradlew" ]; then
            cd "$PROJECT"
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "$PROJECT/scripts/build-frontend-apk-wsl.sh" ]; then
            cd "$PROJECT"
            bash scripts/build-frontend-apk-wsl.sh
          else
            echo "::error::Не найден поддерживаемый скрипт сборки."
            echo "Нужно определить команду сборки из README проекта."
            exit 1
          fi

      - name: Сохранить APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Android-APK
          path: |
            extracted/**/*.apk
            extracted/**/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 7
