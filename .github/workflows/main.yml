name: Сборка OBS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5

      - name: Распаковать проект
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q OBS_Android_APK_build_ready_RU.zip -d extracted
          find extracted -maxdepth 5 -type f \
            \( -name 'build-frontend-apk-wsl.sh' \
            -o -name 'gradlew' \
            -o -name 'README.md' \)

      - name: Установить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="$(find extracted -type f \
            -name 'build-frontend-apk-wsl.sh' -print -quit)"

          if [ -n "$SCRIPT" ]; then
            cd "$(dirname "$SCRIPT")"
            bash "$(basename "$SCRIPT")"
          else
            WRAPPER="$(find extracted -type f \
              -name gradlew -print -quit)"

            if [ -n "$WRAPPER" ]; then
              cd "$(dirname "$WRAPPER")"
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "::error::Скрипт сборки или Gradle Wrapper не найден."
              exit 1
            fi
          fi

      - name: Найти и сохранить APK
        if: success()
        shell: bash
        run: |
          mkdir -p apk-output
          find extracted -type f -name '*.apk' \
            -exec cp {} apk-output/ \;

          if ! find apk-output -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "::error::APK не найден после сборки."
            exit 1
          fi

      - name: Загрузить APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Android-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
