name: Подготовка OBS Android

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать проект
        run: |
          unzip -q OBS_Android_APK_build_ready_RU.zip -d extracted
          echo "Содержимое архива:"
          find extracted -maxdepth 3 -type f \( -name build.sh -o -name build-frontend-apk-wsl.sh -o -name README.md \)

      - name: Проверить инструменты
        run: |
          java -version
          cmake --version
          df -h /
