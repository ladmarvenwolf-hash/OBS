name: Сборка OBS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать проект
        run: |
          unzip -q OBS_Android_APK_build_ready_RU.zip -d extracted
          cd extracted/OBS_for_Android-main
          echo "Путь к проекту:"
          pwd
          echo "Файлы:"
          ls -la

      - name: Проверить требования сборки
        run: |
          cd extracted/OBS_for_Android-main
          sed -n '1,160p' scripts/build-frontend-apk-wsl.sh
