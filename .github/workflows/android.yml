name: OBS Android - проверка окружения

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Проверить скрипты сборки
        run: |
          test -f OBS_for_Android-main/scripts/build-frontend-apk-wsl.sh
          test -f OBS_for_Android-main/deps-android/build.sh
          echo "Скрипты найдены"

      - name: Проверить инструменты
        run: |
          java -version
          cmake --version
          df -h /
