name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle Wrapper gradlew not found."
            echo "Check the repository structure and README."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
